<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل التشخيصات الطبية | MENA NAZIH</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1a5f7a;
            --secondary-color: #22a6b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --acute-color: #ff7675;
            --chronic-color: #fdcb6e;
            --psych-color: #a29bfe;
            --dental-color: #74b9ff;
            --followup-color: #fab1a0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
        }
        
        .author-name {
            font-size: 1.2rem;
            color: #ffeaa7;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .ctrl-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 18px;
            border-radius: 30px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn:hover { background-color: rgba(255, 255, 255, 0.35); }
        .print-btn { background-color: #e84393; border: none; }
        .print-btn:hover { background-color: #d63031; }

        .search-container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            font-size: 1.1rem;
            border: 2px solid transparent;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            outline: none;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
        }

        .search-container i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.3rem;
        }

        .container {
            max-width: 1250px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            border-top: 5px solid var(--secondary-color);
            display: flex;
            flex-direction: column;
        }

        .card.is-dental { border-top-color: var(--dental-color); }
        .card.is-fracture { border-top-color: var(--acute-color); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 0.5rem;
        }

        .abbr { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); direction: ltr; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
        }

        .type-حاد { background-color: var(--acute-color); }
        .type-مزمن { background-color: var(--chronic-color); color: #333; }
        .type-نفسي { background-color: var(--psych-color); }
        .type-أسنان { background-color: var(--dental-color); }
        .type-متابعة { background-color: var(--followup-color); color: #333; }

        .title-en { font-size: 1rem; color: var(--text-light); margin-bottom: 0.3rem; direction: ltr; text-align: left; font-weight: 500; }
        .title-ar { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.8rem; color: var(--text-dark); }
        
        /* تفاصيل الوصف العامي (مخفية في الوضع المختصر) */
        .extra-details {
            display: none; 
            background-color: rgba(34, 166, 179, 0.08);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border-right: 4px solid var(--secondary-color);
        }

        body.detailed-view .extra-details {
            display: block; 
        }

        .extra-details p {
            margin: 0 0 5px 0;
        }
        .extra-details p:last-child {
            margin-bottom: 0;
        }

        /* تذييل الكارت الذي يحتوي الكود وزر جوجل (مخفي في الوضع المختصر) */
        .card-footer {
            display: none; 
            justify-content: space-between;
            align-items: center;
            padding-top: 0.8rem;
            border-top: 1px dashed #e1e1e1;
            margin-top: auto;
        }

        body.detailed-view .card-footer {
            display: flex; 
        }

        .icd10 { 
            font-size: 0.85rem; 
            font-weight: 700; 
            background-color: #f1f2f6; 
            padding: 4px 8px; 
            border-radius: 6px; 
            direction: ltr; 
            color: #2f3640;
        }

        .google-search-link {
            font-size: 0.85rem;
            color: #0984e3;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .google-search-link:hover { text-decoration: underline; }

        /* إعدادات الطباعة لورق A5 */
        @media print {
            @page {
                size: A5;
                margin: 10mm;
            }
            body {
                background: white;
                font-size: 11pt;
            }
            header, .search-container, .header-controls {
                display: none !important; 
            }
            .container {
                margin: 0;
                padding: 0;
            }
            .grid {
                display: block;
                column-count: 2; 
                column-gap: 15px;
            }
            .card {
                page-break-inside: avoid;
                break-inside: avoid;
                border: 1px solid #ddd;
                border-top: 3px solid #ccc;
                box-shadow: none;
                margin-bottom: 10px;
                padding: 8px;
            }
            .card-header { margin-bottom: 4px; padding-bottom: 2px; }
            .abbr { font-size: 12pt; color: black; }
            .badge { border: 1px solid #333; color: black !important; background: transparent !important; padding: 2px 5px; font-size: 9pt; }
            .title-en { font-size: 10pt; color: #333; margin-bottom: 2px; }
            .title-ar { font-size: 11pt; margin-bottom: 0; }
            
            /* إخفاء زر جوجل دائماً في الطباعة */
            .google-search-link {
                display: none !important;
            }

            body.detailed-view .extra-details {
                display: block;
                background: none;
                border: none;
                border-top: 1px dotted #ccc;
                padding: 4px 0;
                font-size: 8.5pt;
            }
            body.detailed-view .card-footer {
                display: flex;
                border-top: none;
                padding-top: 0;
            }
        }
    </style>
</head>

            ["VBI", "Vertebrobasilar Insufficiency", "نقص مؤقت في تدفق الدم للدماغ", "حاد", "دوخة دوران نتيجة نقص دم المؤخرة", "G45.0"],
            ["VC nodules", "Vocal cord nodules", "عقيدات الحبال الصوتية", "حاد", "لحمية أو عقد صوتية بحبال الصوت", "J38.2"],
            ["VMR", "Vasomotor Rhinitis", "التهاب الأنف الحركي الوعائي", "مزمن", "حساسية أنف من الروائح وتغير الجو", "J30.0"],
            ["VVC", "Candidal Vulvovaginitis", "التهاب المهبل الفطري", "حاد", "التهاب فطري مهبلي فطر المبيضات", "B37.3"]
        ];

        const resultsGrid = document.getElementById('resultsGrid');
        const searchInput = document.getElementById('searchInput');

        function renderCards(data) {
            resultsGrid.innerHTML = '';
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                if (item[0] === '+' || item[3].includes('أسنان')) card.classList.add('is-dental');
                if (item[0] === '#' || item[3].includes('كسر')) card.classList.add('is-fracture');
                
                let badgeClass = 'type-' + item[3].split('/')[0].trim(); 
                
                let iconHtml = '';
                if (item[0] === '+' || item[3].includes('أسنان')) iconHtml = '<i class="fa-solid fa-tooth"></i>';
                else if (item[0] === '#' || item[3].includes('كسر')) iconHtml = '<i class="fa-solid fa-bone"></i>';

                const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(item[1] + ' ' + item[2])}`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="abbr">${iconHtml} ${item[0]}</div>
                        <div class="badge ${badgeClass}">${item[3]}</div>
                    </div>
                    <div class="title-en">${item[1]}</div>
                    <div class="title-ar">${item[2]}</div>
                    
                    <div class="extra-details">
                        <p><strong>العامي:</strong> ${item[4] || 'غير متوفر'}</p>
                    </div>

                    <div class="card-footer">
                        <span class="icd10" title="ICD-10 Code">${item[5] || '---'}</span>
                        <a href="${googleSearchUrl}" target="_blank" class="google-search-link">
                            <i class="fa-brands fa-google"></i> بحث جوجل
                        </a>
                    </div>
                `;
                resultsGrid.appendChild(card);
            });
        }

        renderCards(rawData);

        function toggleView() {
            document.body.classList.toggle('detailed-view');
            const btn = document.getElementById('toggleViewBtn');
            if (document.body.classList.contains('detailed-view')) {
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> الوضع المختصر (إخفاء العامي والكود)';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-eye"></i> الوضع المفصل (إظهار العامي والكود)';
            }
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            const filteredData = rawData.filter(item => 
                item[0].toLowerCase().includes(searchTerm) ||
                item[1].toLowerCase().includes(searchTerm) ||
                item[2].includes(searchTerm) ||
                item[3].includes(searchTerm) ||
                (item[4] && item[4].includes(searchTerm)) ||
                (item[5] && item[5].toLowerCase().includes(searchTerm))
            );
            renderCards(filteredData);
        });
    </script>
</body>
</html>
